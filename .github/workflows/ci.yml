name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: page-lens-reader
          path: dist/*.zip
